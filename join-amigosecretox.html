<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amigo Secreto X</title>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px 20px; background-color: #0d4221; color: #ffffff;">
    <h3>Redirecionando para o Amigo Secreto X...</h3>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code') || urlParams.get('groupId') || "";

        if (code) {
            // 1. Tenta abrir o aplicativo Android direto com o código preenchido
            window.location.href = "amigosecretox://join?code=" + code;

            // 2. Se o app não estiver instalado (após 1.5s), redireciona para a Google Play Store
            setTimeout(function() {
                window.location.href = "https://play.google.com/store/apps/details?id=com.celsinhoricardo.amigosecretox";
            }, 1500);
        } else {
            window.location.href = "https://play.google.com/store/apps/details?id=com.celsinhoricardo.amigosecretox";
        }
    </script>
</body>
</html>
